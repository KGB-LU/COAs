<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#040a16" />
<title>KGB / LU COAs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23061a33'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' text-anchor='middle' fill='%232aa8ff'%3EK%3C/text%3E%3C/svg%3E" />
<style>
  :root { --bg:#040a16; --panel:#0a1a31; --panel2:#0d2140; --line:#17345a; --text:#e8eef7; --muted:#8da3bd; --blue:#2aa8ff; --blue2:#1273d6; --silver:#cfd9e6; }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--text); background: radial-gradient(1200px 500px at 50% -120px, #0f3a73 0%, rgba(4,10,22,0) 70%), var(--bg); min-height:100vh; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  .banner { display:block; width:100%; height:auto; border-radius:14px; border:1px solid var(--line); box-shadow:0 0 40px rgba(42,168,255,.18); }
  .eyebrow { margin:22px 0 4px; font:600 .72rem ui-monospace, Menlo, Consolas, monospace; letter-spacing:.18em; color:var(--blue); text-transform:uppercase; }
  h1 { margin:0 0 6px; font-size:2rem; letter-spacing:-.01em; background:linear-gradient(180deg,#fff,#aebccd); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); margin:0 0 6px; font-size:.95rem; }
  .controls { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:10px; padding:12px 0; background:linear-gradient(var(--bg) 78%, rgba(4,10,22,0)); }
  .controls input, .controls select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:.95rem; outline:none; }
  .controls input:focus, .controls select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(42,168,255,.18); }
  #search { flex:1 1 280px; min-width:0; }
  .controls select { flex:0 1 auto; max-width:100%; }
  #status { color:var(--muted); font:.78rem ui-monospace, Menlo, Consolas, monospace; margin:6px 0 14px; }
  .group { margin:26px 0 8px; }
  .ghead { display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:12px; }
  .ghead h2 { margin:0; font-size:1.2rem; color:var(--silver); }
  .ghead span { color:var(--blue); font:.75rem ui-monospace, Menlo, Consolas, monospace; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(185px, 1fr)); gap:12px; }
  .card { display:block; text-decoration:none; color:inherit; background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:12px; overflow:hidden; transition:transform .12s, border-color .12s, box-shadow .12s; }
  .card:hover { transform:translateY(-2px); border-color:var(--blue); box-shadow:0 6px 24px rgba(42,168,255,.2); }
  .thumb { position:relative; aspect-ratio:4/3; background:#06101f; overflow:hidden; border-bottom:1px solid var(--line); }
  .thumb img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; background:#fff; }
  .ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--blue); font:700 1.1rem ui-monospace, Menlo, Consolas, monospace; letter-spacing:.12em; }
  .meta { padding:10px 11px 12px; }
  .fname { font-size:.82rem; font-weight:600; word-break:break-all; color:var(--text); margin-bottom:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { font:600 .68rem ui-monospace, Menlo, Consolas, monospace; padding:2px 7px; border-radius:999px; background:rgba(42,168,255,.14); color:#7cc8ff; border:1px solid rgba(42,168,255,.3); }
  .chip.g { background:rgba(207,217,230,.08); color:var(--silver); border-color:rgba(207,217,230,.2); }
  .empty { color:var(--muted); text-align:center; padding:50px 10px; border:1px dashed var(--line); border-radius:12px; }
  footer { margin-top:40px; color:var(--muted); font-size:.8rem; text-align:center; }
</style>
</head>

  <div class="eyebrow">Certificates of Analysis</div>
  <h1>KGB / LU COAs</h1>
  <p class="sub">Public catalog. Anyone with this link can open and download these certificates.</p>

  <div class="controls">
    <input type="search" id="search" placeholder="Search product, size, color, date or filename..." autocomplete="off" />
    <select id="product"></select>
    <select id="size"><option value="">All sizes</option></select>
    <select id="type">
      <option value="">All types</option>
      <option value="pdf">PDFs</option>
      <option value="image">Images</option>
    </select>
  </div>
  <div id="status">Loading files...</div>
  <div id="results"></div>
  <footer>Hosted on GitHub &middot; KGB-LU/COAs</footer>
</div>

<script>
  var ORG = "KGB-LU", REPO = "COAs", BRANCH = "main";
  var DOCS = "docs/", THUMBS = "thumbs/";
  var COLORS = ["black","white","red","blue","green","yellow","orange","purple","pink","clear","bronze","silver","gold","gray","grey","brown","teal","cyan"];
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  var resultsEl = document.getElementById("results");
  var statusEl = document.getElementById("status");
  var searchEl = document.getElementById("search");
  var prodEl = document.getElementById("product");
  var sizeEl = document.getElementById("size");
  var typeEl = document.getElementById("type");
  var allFiles = [];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function encPath(p) { return p.split("/").map(encodeURIComponent).join("/"); }

  function parse(name) {
    var extM = name.match(/\.([^.]+)$/);
    var ext = extM ? extM[1].toLowerCase() : "";
    var base = name.replace(/\.[^.]+$/, "");
    var date = null, rest = base;
    var dm = base.match(/(\d{1,2})\.(\d{1,2})\.(\d{2})$/);
    if (dm) { date = new Date(2000 + Number(dm[3]), Number(dm[1]) - 1, Number(dm[2])); rest = base.slice(0, dm.index); }
    rest = rest.replace(/[.\s_-]+$/, "");
    var product = rest, size = "", color = "";
    var pm = rest.match(/^(.*?)(\d+(?:\.\d+)?[Kk]?)\.?([A-Za-z]*)$/);
    if (pm && pm[1]) {
      product = pm[1].replace(/[.\s_-]+$/, ""); size = pm[2].toUpperCase(); color = pm[3];
    } else {
      for (var i = 0; i < COLORS.length; i++) {
        var c = COLORS[i];
        if (rest.toLowerCase().slice(-c.length) === c && rest.length > c.length) { product = rest.slice(0, rest.length - c.length); color = rest.slice(-c.length); break; }
      }
    }
    if (!product) { product = base; }
    var kind = ext === "pdf" ? "pdf" : (["jpg","jpeg","png","webp","gif"].indexOf(ext) !== -1 ? "image" : "file");
    return { name:name, base:base, url:DOCS + name, ext:ext, kind:kind, date:date, product:product, productKey:product.toLowerCase(), size:size, color:color,
             hay:(name + " " + product + " " + size + " " + color).toLowerCase() };
  }

  function fmtDate(d) { return d ? MON[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear() : ""; }

  function fetchTree() {
    var key = "coa-tree-v2", now = Date.now();
    try {
      var c = JSON.parse(sessionStorage.getItem(key) || "null");
      if (c && now - c.t < 60000) { return Promise.resolve(c.names); }
    } catch (e) {}
    return fetch("https://api.github.com/repos/" + ORG + "/" + REPO + "/git/trees/" + BRANCH + "?recursive=1")
      .then(function (r) { if (!r.ok) { throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function (data) {
        var names = (data.tree || [])
          .filter(function (i) { return i.type === "blob" && i.path.indexOf(DOCS) === 0 && !/\.gitkeep$/.test(i.path); })
          .map(function (i) { return i.path.slice(DOCS.length); });
        try { sessionStorage.setItem(key, JSON.stringify({ t: now, names: names })); } catch (e) {}
        return names;
      });
  }

  function buildFilters() {
    var prods = {}, sizes = {};
    allFiles.forEach(function (f) { prods[f.productKey] = f.product; if (f.size) { sizes[f.size] = true; } });
    var pk = Object.keys(prods).sort();
    prodEl.innerHTML = '<option value="">All products (' + pk.length + ')</option>' +
      pk.map(function (k) { return '<option value="' + esc(k) + '">' + esc(prods[k]) + '</option>'; }).join("");
    var sk = Object.keys(sizes).sort(function (a, b) { return parseFloat(a) - parseFloat(b) || a.localeCompare(b); });
    sizeEl.innerHTML = '<option value="">All sizes</option>' +
      sk.map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + '</option>'; }).join("");
  }

  function card(f) {
    var thumb = THUMBS + encodeURIComponent(f.name) + ".webp";
    var chips = "";
    if (f.size) { chips += '<span class="chip">' + esc(f.size) + '</span>'; }
    if (f.color) { chips += '<span class="chip g">' + esc(f.color) + '</span>'; }
    if (f.date) { chips += '<span class="chip g">' + esc(fmtDate(f.date)) + '</span>'; }
    chips += '<span class="chip g">' + esc(f.ext || "file") + '</span>';
    var inner = f.kind === "file"
      ? '<div class="ph">FILE</div>'
      : '<img loading="lazy" decoding="async" width="360" height="270" alt="" src="' + esc(thumb) + '" data-kind="' + f.kind + '" data-orig="' + esc(encPath(f.url)) + '" />';
    return '<a class="card" href="' + esc(encPath(f.url)) + '" target="_blank" rel="noopener">' +
      '<div class="thumb">' + inner + '</div>' +
      '<div class="meta"><div class="fname">' + esc(f.base) + '</div><div class="chips">' + chips + '</div></div></a>';
  }

  function render() {
    var terms = searchEl.value.toLowerCase().trim();
    terms = terms ? terms.split(/\s+/) : [];
    var prod = prodEl.value, size = sizeEl.value, type = typeEl.value;
    var list = allFiles.filter(function (f) {
      if (prod && f.productKey !== prod) { return false; }
      if (size && f.size !== size) { return false; }
      if (type && f.kind !== type) { return false; }
      for (var i = 0; i < terms.length; i++) { if (f.hay.indexOf(terms[i]) === -1) { return false; } }
      return true;
    });
    var groups = {};
    list.forEach(function (f) {
      if (!groups[f.productKey]) { groups[f.productKey] = { name: f.product, files: [] }; }
      groups[f.productKey].files.push(f);
    });
    var keys = Object.keys(groups).sort();
    statusEl.textContent = keys.length + " products / " + list.length + " certificates shown";
    if (!list.length) { resultsEl.innerHTML = '<div class="empty">No certificates match your search.</div>'; return; }
    resultsEl.innerHTML = keys.map(function (k) {
      var g = groups[k];
      g.files.sort(function (a, b) { return (b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0) || a.name.localeCompare(b.name); });
      return '<section class="group"><div class="ghead"><h2>' + esc(g.name) + '</h2><span>' + g.files.length + (g.files.length === 1 ? " test" : " tests") + '</span></div>' +
        '<div class="grid">' + g.files.map(card).join("") + '</div></section>';
    }).join("");
  }

  resultsEl.addEventListener("error", function (e) {
    var t = e.target;
    if (!t || t.tagName !== "IMG") { return; }
    if (t.dataset.kind === "image" && !t.dataset.tried) { t.dataset.tried = "1"; t.src = t.dataset.orig; return; }
    var d = document.createElement("div");
    d.className = "ph";
    d.textContent = t.dataset.kind === "pdf" ? "PDF" : "FILE";
    t.replaceWith(d);
  }, true);

  var timer = null;
  searchEl.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(render, 80); });
  prodEl.addEventListener("change", render);
  sizeEl.addEventListener("change", render);
  typeEl.addEventListener("change", render);

  fetchTree().then(function (names) {
    allFiles = names.map(parse);
    buildFilters();
    render();
  }).catch(function (err) {
    statusEl.textContent = "Could not load the file list (" + err.message + "). Please wait a minute and refresh.";
  });
</script>
</body>
</html>
